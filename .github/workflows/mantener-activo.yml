# Evita que el backend gratis de Render se duerma (lo apaga tras 15 min sin trafico).
# GitHub puede retrasar los cron unos minutos; cada 10 min deja margen.
# Ojo: GitHub desactiva los cron de repos publicos tras 60 dias sin actividad.
name: Mantener backend activo
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: GET /salud
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 90 https://reportaya-api-mcg4.onrender.com/salud) && [ "$code" = 200 ] && { echo "ok ($code)"; exit 0; }
            echo "intento $i: $code"; sleep 20
          done
          exit 1
